name: Build ReSukiSU Kernel M51

on:
  workflow_dispatch:
  push:
    branches: [ ten, ten-stock ]

permissions:
  contents: write

env:
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: ten
            defconfig: m51_eur_open_defconfig
            suffix: ten
          - branch: ten-stock
            defconfig: m51_eur_open_defconfig
            suffix: ten-stock

    steps:
      - name: Checkout kernel (${{ matrix.branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify ReSukiSU submodule
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .gitmodules || { echo "::error::.gitmodules tidak ada — ReSukiSU bukan submodule"; exit 1; }
          URL=$(git config --file .gitmodules --get submodule.KernelSU.url)
          echo "KernelSU submodule url: $URL"
          case "$URL" in
            *ReSukiSU/ReSukiSU*) echo "OK: sumber ReSukiSU valid" ;;
            *) echo "::error::Submodule KernelSU bukan dari ReSukiSU (dapat: $URL)"; exit 1 ;;
          esac
          git submodule status
          test -d KernelSU/kernel || { echo "::error::KernelSU/kernel tidak ada"; exit 1; }
          echo "ReSukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          git -C KernelSU describe --tags --always

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev \
            build-essential python3 zip unzip curl libncurses-dev device-tree-compiler

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Kegagalan di sini WAJIB menggagalkan build. Jangan pernah pakai "|| true":
      # itu menyembunyikan integrasi ReSukiSU yang tidak ter-apply.
      - name: Apply / refresh ReSukiSU integration
        run: |
          python3 apply_resukisu.py --repo "$GITHUB_WORKSPACE" --defconfig m51 --skip execve,sys_reboot
          git diff --stat

      - name: Fix gcc-wrapper.py (py2 -> py3)
        run: |
          W="scripts/gcc-wrapper.py"
          if [ -f "$W" ]; then
            python3 - "$W" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8", errors="ignore").read()
          s = s.replace("#!/usr/bin/env python2", "#!/usr/bin/env python3")
          s = re.sub(r'print\s+(.+)$', lambda m: f'print({m.group(1)})', s, flags=re.MULTILINE)
          open(p, "w", encoding="utf-8").write(s)
          print("gcc-wrapper.py: converted print statements to python3 syntax")
          PYEOF
          else
            echo "scripts/gcc-wrapper.py tidak ada, skip"
          fi

      - name: Setup toolchain (LineageOS gcc 4.9)
        shell: bash
        run: |
          set -Eeuo pipefail

          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain"
          GCC64="$TOOLCHAIN/gcc64"
          GCC32="$TOOLCHAIN/gcc32"

          mkdir -p "$TOOLCHAIN"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            "$GCC64"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            "$GCC32"

          chmod -R u+rx "$GCC64/bin" "$GCC32/bin"

          AARCH64_GCC="$GCC64/bin/aarch64-linux-android-gcc"
          ARM32_GCC="$GCC32/bin/arm-linux-androideabi-gcc"

          test -x "$AARCH64_GCC" || {
            echo "::error::Missing or non-executable compiler: $AARCH64_GCC"
            exit 1
          }
          test -x "$ARM32_GCC" || {
            echo "::error::Missing or non-executable compiler: $ARM32_GCC"
            exit 1
          }

          "$AARCH64_GCC" --version
          "$ARM32_GCC" --version

      - name: Build kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          export GCC64="$GITHUB_WORKSPACE/toolchain/gcc64/bin"
          export GCC32="$GITHUB_WORKSPACE/toolchain/gcc32/bin"
          export PATH="$GCC64:$GCC32:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE="$GCC64/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32/arm-linux-androideabi-"

          unset CC LLVM CLANG_TRIPLE

          make O=out ARCH=arm64 \
            HOSTCFLAGS="-fcommon" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "${{ matrix.defconfig }}"

          # FORTIFY_SOURCE false-positive di GCC 4.9 (bug __builtin_object_size
          # pada fungsi yang di-clone/inline oleh compiler) -> matikan.
          ./scripts/config --file out/.config -d FORTIFY_SOURCE
          make O=out ARCH=arm64 \
            HOSTCFLAGS="-fcommon" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          # Sanity check: KSU harus benar-benar aktif di .config final
          grep -q "^CONFIG_KSU=y" out/.config || {
            echo "::error::CONFIG_KSU=y hilang dari out/.config setelah olddefconfig"
            exit 1
          }
          grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config || {
            echo "::error::CONFIG_KSU_MANUAL_HOOK=y hilang dari out/.config"
            exit 1
          }

          make O=out ARCH=arm64 \
            HOSTCFLAGS="-fcommon" \
            CC="$GCC64/aarch64-linux-android-gcc" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          # SM7150 M51 memakai base DTB sdmmagpie.dtb yang di-append ke Image
          # (CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y / CONFIG_IMG_GZ_DTB=y),
          # jadi Image.gz-dtb WAJIB berisi Image.gz + minimal satu DTB.
          make O=out ARCH=arm64 \
            HOSTCFLAGS="-fcommon" \
            CC="$GCC64/aarch64-linux-android-gcc" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image.gz-dtb 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Show errors on failure
        if: failure()
        run: |
          grep -nE "error:|Error [0-9]+" "$GITHUB_WORKSPACE/build.log" | head -50 || true

      # Gerbang keras: kernel tanpa DTB akan boot-fault dan TWRP melaporkan
      # "Unable to determine partition". Jangan lanjut kalau DTB tidak ter-append.
      - name: Validate kernel image + appended DTB
        id: img
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Isi out/arch/arm64/boot:"
          find out/arch/arm64/boot -maxdepth 1 -type f -exec ls -la {} \;

          IMG="out/arch/arm64/boot/Image.gz-dtb"
          test -f "$IMG" || {
            echo "::error::Image.gz-dtb tidak ditemukan — kernel+DTB tidak tergabung"
            exit 1
          }

          echo "Image.gz-dtb size: $(stat -c%s "$IMG") bytes"
          python3 - "$IMG" <<'PYEOF'
          import sys, gzip, zlib

          # Image.gz-dtb = Image.gz (gzip stream) + DTB mentah (append).
          # Jadi file TIDAK selalu gunzip bersih: setelah stream gzip
          # berakhir masih ada byte DTB. Dekompres hanya stream gzip-nya,
          # ambil sisa byte mentahnya, lalu cari DTB di keduanya.
          path = sys.argv[1]
          raw = open(path, "rb").read()
          print(f"total bytes: {len(raw)}")

          if raw[:2] != b"\x1f\x8b":
              print("::error::Image.gz-dtb bukan gzip (magic 1f8b tidak ada). "
                    "CONFIG_BUILD_ARM64_KERNEL_COMPRESSION_GZIP tidak aktif?")
              sys.exit(1)

          d = gzip.GzipFile(fileobj=__import__("io").BytesIO(raw))
          try:
              image = d.read()
              consumed = d.fileobj.tell()
          except Exception as e:
              print(f"::error::gagal dekompres gzip: {e}")
              sys.exit(1)

          tail = raw[consumed:]
          print(f"decompressed Image: {len(image)} bytes; "
                f"sisa setelah stream gzip: {len(tail)} bytes")

          if image[0x38:0x3c] != b"ARM\x64":
              print("::error::Payload bukan ARM64 Image (magic @0x38 salah)")
              sys.exit(1)

          n_img = image.count(b"\xd0\x0d\xfe\xed")
          n_tail = tail.count(b"\xd0\x0d\xfe\xed")
          n = n_img + n_tail
          print(f"ARM64 magic OK @0x38; DTB magic -> di Image: {n_img}, "
                f"di sisa: {n_tail}, total: {n}")
          if n == 0:
              print("::error::Tidak ada DTB ter-append ke Image.gz-dtb. "
                    "Boot image M51 akan invalid -> jangan pakai untuk flash.")
              sys.exit(1)

          hay = image + tail
          if b"qcom,sm7150" not in hay and b"sdmmagpie" not in hay:
              print("::error::DTB ter-append tapi bukan tree SM7150/sdmmagpie — "
                    "device tree salah untuk M51.")
              sys.exit(1)
          print("OK: DTB SM7150/sdmmagpie ter-append ke Image.gz-dtb")
          PYEOF

          echo "path=$IMG" >> "$GITHUB_OUTPUT"

      - name: Clone AnyKernel3
        run: git clone --depth=1 "$ANYKERNEL_REPO" AK3

      - name: Package flashable zip
        shell: bash
        run: |
          set -Eeuo pipefail

          SHORT_SHA=$(git rev-parse --short HEAD)
          STAMP=$(TZ=Asia/Jakarta date +%Y%m%d-%H%M)
          ZIPNAME="ReSukiSU-Kernel-M51-${{ matrix.suffix }}-${STAMP}-WIB-${SHORT_SHA}.zip"
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

          cp "${{ steps.img.outputs.path }}" AK3/

          cat > AK3/anykernel.sh <<'EOK'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=ReSukiSU Kernel for Samsung Galaxy M51 (SM-M515F, SM7150)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=m51
          device.name2=m51eur
          device.name3=SM-M515F
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          ### AnyKernel install
          # begin attributes
          attributes() {
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
          } # end attributes

          ## boot shell variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh && attributes;

          # boot install
          dump_boot;
          write_boot;
          ## end boot install
          EOK

          # Audit bukti anykernel + DTB untuk artifact rilis
          {
            echo "== anykernel.sh (branch ${{ matrix.branch }}) =="
            echo "commit: $(git rev-parse HEAD)"
            echo "block:  $(grep -m1 '^block=' AK3/anykernel.sh)"
            echo "slot:   $(grep -m1 '^is_slot_device=' AK3/anykernel.sh)"
            echo "devicecheck: $(grep -m1 '^do.devicecheck=' AK3/anykernel.sh)"
            echo "device.name1: $(grep -m1 '^device.name1=' AK3/anykernel.sh)"
            echo ""
            echo "== Image.gz-dtb =="
            ls -la AK3/Image.gz-dtb
            sha256sum AK3/Image.gz-dtb
            echo ""
            echo "== appended DTB check =="
            gunzip -c AK3/Image.gz-dtb > /tmp/audit.raw
            python3 -c "d=open('/tmp/audit.raw','rb').read(); print('arm64 magic @0x38:', d[0x38:0x3c]); print('DTB magic count:', d.count(b'\xd0\x0d\xfe\xed'))"
          } > "$GITHUB_WORKSPACE/anykernel-audit-${{ matrix.suffix }}.txt"

          cp out/.config "$GITHUB_WORKSPACE/config-${{ matrix.suffix }}.txt"
          cp build.log "$GITHUB_WORKSPACE/build-${{ matrix.suffix }}.log"

          {
            echo "device=Samsung Galaxy M51 (SM-M515F)"
            echo "codename=m51"
            echo "kernel=Linux 4.14 Non-GKI (SM7150)"
            echo "branch=${{ matrix.branch }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "defconfig=${{ matrix.defconfig }}"
            echo "recovery=TWRP"
            echo "packaging=AnyKernel3"
            echo "resukisu_commit=$(git -C KernelSU rev-parse HEAD)"
            echo "resukisu_url=https://github.com/ReSukiSU/ReSukiSU"
            echo "build_date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$GITHUB_WORKSPACE/build-info-${{ matrix.suffix }}.txt"

          cd AK3
          zip -r9 "../$ZIPNAME" . -x '.git/*' '.github/*' 'README.md'

      - name: Validate zip + write checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          unzip -t "$ZIPNAME"
          unzip -l "$ZIPNAME" | grep -q "Image.gz-dtb" || {
            echo "::error::ZIP tidak memuat Image.gz-dtb"; exit 1
          }
          unzip -l "$ZIPNAME" | grep -q "anykernel.sh" || {
            echo "::error::ZIP tidak memuat anykernel.sh"; exit 1
          }
          unzip -l "$ZIPNAME" | grep -q "META-INF/com/google/android/update-binary" || {
            echo "::error::ZIP tidak memuat update-binary (bukan TWRP package)"; exit 1
          }
          if unzip -l "$ZIPNAME" | grep -q "\.git/"; then
            echo "::error::ZIP masih memuat direktori .git/"; exit 1
          fi
          sha256sum "$ZIPNAME" > SHA256SUMS-${{ matrix.suffix }}.txt
          cat SHA256SUMS-${{ matrix.suffix }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-M51-${{ matrix.suffix }}
          path: |
            ${{ env.ZIPNAME }}
            SHA256SUMS-${{ matrix.suffix }}.txt
            config-${{ matrix.suffix }}.txt
            build-${{ matrix.suffix }}.log
            build-info-${{ matrix.suffix }}.txt
            anykernel-audit-${{ matrix.suffix }}.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_number }}-${{ matrix.suffix }}-${{ github.sha }}
          name: "ReSukiSU Kernel M51 [${{ matrix.suffix }}] build #${{ github.run_number }}"
          files: |
            ${{ env.ZIPNAME }}
            SHA256SUMS-${{ matrix.suffix }}.txt
            config-${{ matrix.suffix }}.txt
            build-info-${{ matrix.suffix }}.txt
            anykernel-audit-${{ matrix.suffix }}.txt
          body: |
            Device: Samsung Galaxy M51 (SM-M515F, codename m51)
            Kernel: Linux 4.14 Non-GKI (SM7150)
            Branch: ${{ matrix.branch }}
            Root: ReSukiSU (submodule KernelSU @ ReSukiSU/ReSukiSU)
            Recovery: TWRP
            Packaging: AnyKernel3 (non-slot, block=/dev/block/bootdevice/by-name/boot)
            Defconfig: ${{ matrix.defconfig }}

            Flash via TWRP. Tanpa wipe data.
            Verifikasi SHA256 sebelum flash.
