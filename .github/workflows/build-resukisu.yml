name: Build ReSukiSU Kernel M51

on:
  workflow_dispatch:
  push:
    branches: [ ten ]

env:
  DEFCONFIG: m51_eur_open_defconfig
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev \
            build-essential python3 zip unzip curl libncurses-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply / refresh ReSukiSU integration
        run: |
          python3 apply_resukisu.py --repo "$GITHUB_WORKSPACE" --defconfig m51 || true
          git diff --stat

      - name: Fix gcc-wrapper.py (py2 -> py3)
        run: |
          W="scripts/gcc-wrapper.py"
          if [ -f "$W" ]; then
            python3 - "$W" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8", errors="ignore").read()
          s = s.replace("#!/usr/bin/env python2", "#!/usr/bin/env python3")
          s = re.sub(r'print\s+(.+)$', lambda m: f'print({m.group(1)})', s, flags=re.MULTILINE)
          open(p, "w", encoding="utf-8").write(s)
          print("gcc-wrapper.py: converted print statements to python3 syntax")
          PYEOF
          else
            echo "scripts/gcc-wrapper.py tidak ada, skip"
          fi

      - name: Setup toolchain (NDK r20b, gcc 4.9)
        shell: bash
        run: |
          set -Eeuo pipefail

          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain"
          NDK_DIR="$TOOLCHAIN/android-ndk-r20b"
          NDK_ZIP="$RUNNER_TEMP/android-ndk-r20b-linux-x86_64.zip"

          mkdir -p "$TOOLCHAIN"

          curl --fail --location --retry 5 \
            -o "$NDK_ZIP" \
            https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip

          unzip -q "$NDK_ZIP" -d "$TOOLCHAIN"

          GCC64="$NDK_DIR/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin"
          GCC32="$NDK_DIR/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"

          AARCH64_GCC="$GCC64/aarch64-linux-android-gcc"
          ARM32_GCC="$GCC32/arm-linux-androideabi-gcc"

          test -x "$AARCH64_GCC" || {
            echo "::error::Missing or non-executable compiler: $AARCH64_GCC"
            find "$NDK_DIR/toolchains" -type f -name '*-gcc' -print
            exit 1
          }

          test -x "$ARM32_GCC" || {
            echo "::error::Missing or non-executable compiler: $ARM32_GCC"
            find "$NDK_DIR/toolchains" -type f -name '*-gcc' -print
            exit 1
          }

          echo "AArch64 compiler:"
          "$AARCH64_GCC" --version

          echo "ARM32 compiler:"
          "$ARM32_GCC" --version

      - name: Build kernel (bypass build_kernel.sh, no stale clang path)
        shell: bash
        run: |
          set -Eeuo pipefail

          NDK_DIR="$GITHUB_WORKSPACE/toolchain/android-ndk-r20b"

          export GCC64="$NDK_DIR/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin"
          export GCC32="$NDK_DIR/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"
          export PATH="$GCC64:$GCC32:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE="$GCC64/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32/arm-linux-androideabi-"

          unset CC LLVM CLANG_TRIPLE

          if grep -RInE 'home/mohaaserver1|llvm8|Snapdragon_LLVM' --exclude-dir=.git . ; then
            echo "::warning::Ditemukan path clang lama hardcoded di atas — build tetap lanjut pakai gcc eksplisit"
          fi

          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc
          aarch64-linux-android-gcc --version
          arm-linux-androideabi-gcc --version

          make O=out ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

          make O=out ARCH=arm64 \
            CC="$GCC64/aarch64-linux-android-gcc" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)"

      - name: Locate kernel image
        id: img
        run: |
          IMG=$(find out -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' 2>/dev/null | head -n1)
          test -n "$IMG"
          echo "path=$IMG" >> "$GITHUB_OUTPUT"

      - name: Clone AnyKernel3
        run: git clone --depth=1 "$ANYKERNEL_REPO" AK3

      - name: Package flashable zip
        run: |
          cp "${{ steps.img.outputs.path }}" AK3/
          cat > AK3/anykernel.sh <<'EOK'
          properties() { '
          kernel.string=ReSukiSU Kernel M51 by AutoBuild
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }
          . tools/ak3-core.sh
          dump_boot
          write_boot
          EOK
          cd AK3
          ZIPNAME="ReSukiSU-M51-$(date +%Y%m%d-%H%M)-$(git -C .. rev-parse --short HEAD).zip"
          zip -r9 "../$ZIPNAME" . -x .git README.md
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-M51-flashable
          path: ${{ env.ZIPNAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_number }}-${{ github.sha }}
          name: "ReSukiSU Kernel M51 build #${{ github.run_number }}"
          files: ${{ env.ZIPNAME }}
          body: |
            Auto build. Flash via TWRP/OrangeFox, tanpa wipe data.
